name: mlops-diabetes

x-app-image: &app-image
  image: mlops-diabetes:local
  build:
    context: .
    dockerfile: Dockerfile

x-app-environment: &app-environment
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_EXPERIMENT_NAME: diabetes-progression
  MODEL_NAME: diabetes-progression-model
  CHAMPION_ALIAS: champion
  RMSE_THRESHOLD: "54.0"
  MIN_R2: "0.40"

services:
  mlflow:
    <<: *app-image
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/data/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
      - --workers
      - "1"
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow/data
      - mlflow-artifacts:/mlflow/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  pipeline:
    <<: *app-image
    command: ["python", "-m", "mlops.pipeline"]
    environment:
      <<: *app-environment
    volumes:
      - pipeline-data:/app/data
      - pipeline-reports:/app/reports
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  api:
    <<: *app-image
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-environment
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
      pipeline:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/model-info', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  mlflow-data:
  mlflow-artifacts:
  pipeline-data:
  pipeline-reports:
